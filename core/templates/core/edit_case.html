{% extends 'core/base.html' %}

{% block title %}แก้ไขเรื่องร้องเรียน: {{ case.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h1 class="fw-bold text-white mb-4">แก้ไขเรื่องร้องเรียน</h1>
        <div class="card">
            <div class="card-body">
                <h5 class="card-title text-muted mb-1">เรื่อง:</h5>
                <h4 class="mb-4">{{ case.title }}</h4>

                {% if case.image_file %}
                    <div class="mb-3">
                        <p class="text-muted mb-1">รูปภาพปัจจุบัน:</p>
                        <img src="{{ case.image_file.url }}" alt="รูปภาพปัจจุบัน"
                             style="max-height: 200px; max-width: 100%; object-fit: contain;" class="rounded border">
                    </div>
                {% endif %}

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-primary">บันทึกการแก้ไข</button>
                        <a href="{% url 'case_detail' case_id=case.id %}" class="btn btn-secondary">กลับ</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
